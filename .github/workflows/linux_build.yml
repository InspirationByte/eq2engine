name: Linux Make

on:
  push:
    paths:
      - '**.c'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hpp'
      - '**.hxx'
      - '**.yml'
      - '**/premake*.lua'
      - 'premake*.lua'
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hpp'
      - '**.hxx'
      - '**.yml'
      - '**/premake*.lua'
      - 'premake*.lua'

env:
  PROJECT_NAME: auto_tests
  BUILD_PLATFORM: x64
  TESTS: ds_tests ppmem_tests scripting_tests
  
  EXE_SUFFIX:


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            make_config: debug
          - configuration: Release
            make_config: release

    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.ACTIONSPAT }}
        submodules: recursive
        
    - name: Setup AppImageTool
      uses: AnimMouse/setup-appimage@v1
      with:
        name: appimagetool
        url: https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        
    - name: Install dependencies 1
      run: sudo add-apt-repository universe && sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build nasm libsdl2-dev libopenal-dev libxxf86vm-dev
   
    - name: Install dependencies 2
      run: ./utils/linux_dev_prepare.sh

    - name: Generate Makefile
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: ./utils/premake5 --file=premake5-tests.lua gmake2
      
    - name: make
      working-directory: ./build/${{env.PROJECT_NAME}}
      run: make config=${{matrix.make_config}}_${{env.BUILD_PLATFORM}} -j10

    - name: Run tests
      working-directory: ./build/${{env.PROJECT_NAME}}/bin/${{env.BUILD_PLATFORM}}/${{matrix.configuration}}
      timeout-minutes: 10
      run: |
        export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)
        failed=""
        for test in $TESTS; do
          ./$test || failed="$failed $test"
        done
        if [ -n "$failed" ]; then echo "::error::Failed tests:$failed"; exit 1; fi
